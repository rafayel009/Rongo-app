<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1EDFF">
<title>Rongo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: slim nav rail + masonry board of vivid color cards on a soft lavender mesh. Chrome stays quiet so the cards carry the color. */
:root{
  --bg:#F1EDFF; --glow1:#FFD3E6; --glow2:#CBE6FF; --glow3:#FFF0B3;
  --panel:rgba(255,255,255,.74); --panel-solid:#FFFFFF;
  --ink:#1D1736; --muted:#5F577D; --line:rgba(29,23,54,.13);
  --accent:#6B4EFF; --accent-ink:#FFFFFF; --accent-soft:rgba(107,78,255,.13);
  --danger:#D81B4A; --ok:#0E9F69;
  --p1:#12A36B; --p2:#E39A0B; --p3:#F2602A; --p4:#D81B7A;
  --shadow:0 8px 22px rgba(70,45,150,.15);
  --c-snow:#FFFFFF; --c-coral:#FF9484; --c-sun:#FFD84F; --c-lime:#BDEB60; --c-mint:#62E3B4;
  --c-teal:#52DADA; --c-sky:#72C9FF; --c-indigo:#A3A9FF; --c-violet:#CEA2FF; --c-pink:#FF9FD4; --c-orange:#FFB866;
  --cink:#1D1736;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14102B; --glow1:#3C1C5E; --glow2:#12396B; --glow3:#4A300F;
    --panel:rgba(38,31,74,.82); --panel-solid:#251E4A;
    --ink:#F4F0FF; --muted:#ABA4CE; --line:rgba(255,255,255,.15);
    --accent:#A592FF; --accent-ink:#140F33; --accent-soft:rgba(165,146,255,.2);
    --danger:#FF6B8A; --ok:#3DDC9A;
    --p1:#3DDC9A; --p2:#FFC247; --p3:#FF8A5C; --p4:#FF5CA8;
    --shadow:0 10px 26px rgba(0,0,0,.42);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14102B; --glow1:#3C1C5E; --glow2:#12396B; --glow3:#4A300F;
  --panel:rgba(38,31,74,.82); --panel-solid:#251E4A;
  --ink:#F4F0FF; --muted:#ABA4CE; --line:rgba(255,255,255,.15);
  --accent:#A592FF; --accent-ink:#140F33; --accent-soft:rgba(165,146,255,.2);
  --danger:#FF6B8A; --ok:#3DDC9A;
  --p1:#3DDC9A; --p2:#FFC247; --p3:#FF8A5C; --p4:#FF5CA8;
  --shadow:0 10px 26px rgba(0,0,0,.42);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(60rem 40rem at 0% 0%,var(--glow1),transparent 60%),radial-gradient(50rem 40rem at 100% 10%,var(--glow2),transparent 60%),radial-gradient(50rem 40rem at 50% 110%,var(--glow3),transparent 60%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; margin:0;
}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}

#app{display:grid;grid-template-columns:216px minmax(0,1fr);gap:22px;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 36px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand svg{width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow)}
#nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nv:hover{background:var(--accent-soft);color:var(--ink)}
.nv[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.nv .badge{margin-left:auto;font-size:12px;background:var(--accent-soft);color:var(--ink);padding:1px 8px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--p2)}
.dot.cloud{background:var(--ok)}
.wrap{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px}
.brand-m{display:none}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:46px;backdrop-filter:blur(8px)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.chipclock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:108px;text-align:right}
.chipclock b{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.chipclock span{font-size:12px;color:var(--muted)}
.ib{width:46px;height:46px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--accent-soft)}
h1.vt{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.025em;margin:0;text-wrap:balance}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.newbar{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;font-weight:700;background:var(--panel-solid);border:1px solid var(--line);color:var(--ink)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--danger)}
.bn{color:#1D1736;border:0}
.bn.n1{background:var(--c-sun)}.bn.n2{background:var(--c-mint)}.bn.n3{background:var(--c-sky)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.fchip:hover{color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 10px}
.board{columns:236px;column-gap:14px}
.card{break-inside:avoid;margin-bottom:14px;position:relative;cursor:pointer;color:var(--cink);color-scheme:light;
  background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--cbg);
  border-radius:20px;padding:14px 14px 10px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px) rotate(-.3deg)}
.card h3{font-family:var(--f-display);font-size:18px;line-height:1.2;margin:0 0 6px;font-weight:700;overflow-wrap:anywhere}
.card .ph{opacity:.5}
.ct{display:flex;gap:6px;align-items:flex-start}
.ct .i{margin-top:2px}
.cbody{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.li{display:flex;gap:8px;align-items:flex-start;padding:2px 0;font-size:14px}
.li span{overflow-wrap:anywhere;min-width:0}
.li.done span{text-decoration:line-through;opacity:.55}
.more{font-size:12px;opacity:.7;margin-top:4px}
.cb{width:20px;height:20px;border-radius:7px;border:2px solid rgba(29,23,54,.55);display:grid;place-items:center;flex:none;margin-top:1px;color:transparent;background:rgba(255,255,255,.4)}
.cb .i{width:13px;height:13px;stroke-width:3}
.done .cb{background:#1D1736;border-color:#1D1736;color:#fff}
.mini{border-collapse:collapse;font-size:12px;width:100%;table-layout:fixed;font-family:var(--f-mono)}
.mini td{border:1px solid rgba(29,23,54,.22);padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.4)}
.mini tr.h td{font-weight:500;background:rgba(255,255,255,.7)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.62);color:#1D1736}
.chip.late{background:#1D1736;color:#fff}
.chip.dn{opacity:.6;text-decoration:line-through}
.chip.lb{font-weight:600;background:rgba(29,23,54,.1)}
.chip .i{width:13px;height:13px}
.p1 .i{color:var(--p1)}.p2 .i{color:var(--p2)}.p3 .i{color:var(--p3)}.p4 .i{color:var(--p4)}
.p1 .i,.p2 .i,.p3 .i,.p4 .i{fill:currentColor}
.acts{display:flex;gap:2px;margin-top:6px;margin-inline:-6px;opacity:0;transition:opacity .15s}
.card:hover .acts,.card:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.act{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#1D1736}
.act:hover{background:rgba(255,255,255,.6)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:22px}
.empty h2{font-family:var(--f-display);font-size:22px;color:var(--ink);margin:0 0 6px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(22,12,56,.55);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;color:#1D1736;color-scheme:light;
  background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--cbg);box-shadow:0 30px 80px rgba(20,8,60,.45)}
.sheet.plain{background:var(--panel-solid);color:var(--ink);color-scheme:inherit}
.sh-head{display:flex;align-items:center;gap:8px;padding:16px 16px 6px 20px}
.sh-head input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.sh-body{padding:4px 20px 12px;overflow:auto;flex:1;min-height:0}
.sh-body textarea{width:100%;background:none;border:0;outline:0;resize:none;min-height:140px;font-size:16px;line-height:1.5}
::placeholder{color:inherit;opacity:.5}
.sh-foot{padding:12px 16px 16px;background:rgba(255,255,255,.35);display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.7;min-width:66px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--cbg);border:2px solid rgba(29,23,54,.25)}
.sw[aria-pressed="true"]{border:3px solid #1D1736;transform:scale(1.12)}
.seg{padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.55);border:1px solid rgba(29,23,54,.18);font-weight:600;font-size:13px;color:#1D1736}
.seg[aria-pressed="true"]{background:#1D1736;color:#fff}
.ctl{background:rgba(255,255,255,.6);border:1px solid rgba(29,23,54,.2);border-radius:10px;padding:6px 10px;color:#1D1736;font-size:14px}
.lirow{display:flex;gap:8px;align-items:center;padding:3px 0}
.lirow input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:4px 0}
.lirow.dn input{text-decoration:line-through;opacity:.55}
.xb{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;opacity:.6;color:inherit}
.xb:hover{opacity:1;background:rgba(255,255,255,.5)}
.grid-wrap{overflow:auto;max-width:100%;border-radius:12px;border:1px solid rgba(29,23,54,.25);background:rgba(255,255,255,.35)}
.st{border-collapse:collapse;font-family:var(--f-mono);font-size:14px;min-width:100%}
.st th{background:rgba(255,255,255,.65);font-weight:500;font-size:12px;padding:5px 8px;border:1px solid rgba(29,23,54,.2);position:sticky;top:0;color:#4b4268}
.st td{border:1px solid rgba(29,23,54,.2);padding:0;min-width:92px}
.st td input{width:100%;background:transparent;border:0;outline:0;padding:7px 9px;font:inherit;color:#1D1736}
.st td input:focus{background:#fff;outline:2px solid var(--accent);outline-offset:-2px}
.st td.n input{text-align:right}
.st tr.h td input{font-weight:500;background:rgba(255,255,255,.45)}
.hint{font-size:12.5px;opacity:.75;margin:8px 0 0}
.tag{display:inline-flex;align-items:center;gap:4px;background:rgba(29,23,54,.12);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;font-weight:600}
.tag button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:inherit}
.tag button:hover{background:rgba(255,255,255,.6)}
.tagin{background:none;border:0;outline:0;min-width:120px;font-size:14px;padding:4px 2px}

/* alerts, toast */
#alerts{position:fixed;z-index:70;right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 32px))}
.alert{background:#1D1736;color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 18px 40px rgba(20,8,60,.5);border:2px solid var(--c-sun);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.alert b{font-family:var(--f-display);font-size:17px;display:block;overflow-wrap:anywhere}
.alert small{opacity:.75}
.alert .row{margin-top:10px}
.alert .btn{background:#fff;color:#1D1736;border:0}
.alert .btn.g{background:rgba(255,255,255,.16);color:#fff}
@keyframes pop{from{transform:translateY(-14px) scale(.96);opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1}

/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;backdrop-filter:blur(8px)}
.panel h2{font-family:var(--f-display);font-size:20px;margin:0}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dn7{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cd{aspect-ratio:1/1;min-height:44px;border-radius:14px;background:var(--panel-solid);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:6px 2px 4px;font-weight:600}
.cd.out{opacity:.4}
.cd.today{border:2px solid var(--accent)}
.cd[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--cbg);border:1px solid rgba(29,23,54,.35)}
.agi{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;margin-top:8px;background:var(--cbg);color:#1D1736;text-align:left;width:100%}
.agi time{font-family:var(--f-mono);font-size:13px;min-width:64px}
.agi b{flex:1;min-width:0;overflow-wrap:anywhere}

/* today */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.clockbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.dig{font-family:var(--f-mono);font-weight:500;font-size:44px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.date{color:var(--muted);font-weight:600}
.tz{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;border-radius:16px;background:var(--panel-solid);border:1px solid var(--line)}
.tz b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.timer{font-family:var(--f-mono);font-size:56px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.prog{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c-pink),var(--c-sun),var(--c-mint));width:0}
.settings-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border:0}
.sheet.plain .seg{background:var(--accent-soft);color:var(--ink);border-color:var(--line)}
.sheet.plain .seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sheet.plain .ctl{background:var(--panel-solid);color:var(--ink);border-color:var(--line)}

@media (max-width:860px){.cal{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);gap:14px;padding-bottom:96px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;max-height:none;flex-direction:row;gap:0;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));background:var(--panel-solid);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(40,20,110,.14)}
  .side .brand,.side-foot{display:none}
  #nav{flex-direction:row;width:100%;justify-content:space-around}
  .nv{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;width:auto;flex:1;align-items:center;border-radius:12px}
  .nv .badge{display:none}
  .brand-m{display:block}
  .brand-m svg{width:38px;height:38px;border-radius:11px;display:block}
  .chipclock{min-width:0;padding:5px 10px}
  .ib.hide-m{display:none}
  h1.vt{font-size:25px}
}

/* v1.1: logo menu, full-page viewer, editor tools */
.i.dotsi{stroke-width:3.6}
.logo-btn{background:none;border:0;padding:0;color:var(--ink);text-align:left;border-radius:12px}
.pop{position:fixed;z-index:75;min-width:210px;background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(20,8,60,.28);padding:6px;display:flex;flex-direction:column;gap:2px}
.pop[hidden]{display:none}
.pop button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:600;text-align:left;width:100%;color:var(--ink)}
.pop button:hover{background:var(--accent-soft)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.ta-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}

<script>

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var PRI=['None','Low','Medium','High','Urgent'];

var KEY='rongo.v1';
var S=null, view='notes', filter={q:'',label:null,pri:0,rem:false}, sortBy='new';
var calMonth=new Date(), calSel=sod(Date.now());
var E=null, MODAL=null, dbRef=null, syncMode='local', saveT=null, writing=false, again=false;
var alertsOpen={}, actx=null;
var timer={len:25*60,left:25*60,running:false,endAt:0,label:'Focus'};

function sod(ms){var x=new Date(ms);x.setHours(0,0,0,0);return x.getTime()}

function whenText(ms){

}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}

/* ---------- data ---------- */
function newItem(type,extra){

}
function seed(){
  var now=Date.now(), m=60000, a=Math.ceil((now+90*m)/m)*m, tm=sod(now)+DAY+10*3600000;
  var items=[];
  var w=newItem('note',{title:'Welcome to Rongo',color:'sun',pinned:true,labels:['example'],body:'Tap any card to open it. Use the three dots in the top corner to edit, duplicate, archive or delete. Pick a color, set a priority and add a reminder from the bar at the bottom of the editor.\n\nNotes, checklists and tables all live here. The Calendar shows every reminder by day, and Today keeps the clock, an agenda and a focus timer in one place.\n\nThese are example cards. Delete them whenever you like.'});
  var g=newItem('list',{title:'Weekend groceries',color:'mint',priority:1,labels:['example','home']});
  g.list=[{id:uid(),t:'Rice',done:false},{id:uid(),t:'Eggs',done:false},{id:uid(),t:'Mangoes',done:false},{id:uid(),t:'Green chilies',done:true},{id:uid(),t:'Tea leaves',done:false}];
  var b=newItem('table',{title:'Monthly budget',color:'sky',labels:['example','money']});
  b.table={hdr:true,rows:[['Item','Planned','Spent','Left'],['Rent','15000','15000','=B2-C2'],['Groceries','8000','6400','=B3-C3'],['Transport','2500','2100','=B4-C4'],['Internet','1200','1200','=B5-C5'],['Total','=SUM(B2:B5)','=SUM(C2:C5)','=SUM(D2:D5)']]};
  var c=newItem('note',{title:'Call Rafi about the project',color:'pink',priority:3,labels:['example','work'],body:'Ask about the revised timeline and who owns the testing.',remind:{at:a,repeat:'none',done:false,firedAt:null}});
  var d=newItem('note',{title:'Submit the monthly report',color:'orange',priority:4,labels:['example','work'],body:'Attach the budget table.',remind:{at:tm,repeat:'none',done:false,firedAt:null}});
  items.push(w,g,b,c,d);
  return items;
}
function normalize(o){
  if(!o||!Array.isArray(o.items))return null;
  o.settings=Object.assign({theme:'auto',weekStart:0,h24:false,tz2:'Europe/London'},o.settings||{});
  o.items.forEach(function(it){it.labels=it.labels||[];it.list=it.list||[];if(COLORS.indexOf(it.color)<0)it.color='snow';it.priority=it.priority|0});

}
function loadLocal(){try{var r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r))}catch(e){}return null}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(pushDb,700);
  clearTimeout(save.n);save.n=setTimeout(function(){if(typeof syncNative==='function')syncNative()},800);
}
async function pushDb(){
  if(!dbRef)return;
  if(writing){again=true;return}
  writing=true;
  try{var json=JSON.stringify(S);await dbRef.set({json:json,updated:S.updated});setSync(json.length>200000?'big':'cloud')}
  catch(e){setSync('local')}

}
function setSync(m){
  syncMode=m;
  var dot=$('#syncdot'),tx=$('#synctxt');if(!dot)return;
  dot.className='dot'+(m==='cloud'?' cloud':'');

}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    var u=await window.claude.use('user'), db=await window.claude.use('db');

        var n=normalize(JSON.parse(d.json));

      }

}

/* ---------- formulas ---------- */
function colName(i){var s='';i++;while(i>0){var r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s}
function colIdx(s){var n=0;s=s.toUpperCase();for(var k=0;k<s.length;k++)n=n*26+s.charCodeAt(k)-64;return n-1}
function num(v){if(typeof v==='number')return v;var s=String(v==null?'':v).replace(/,/g,'').trim();if(s==='')return NaN;var n=Number(s);return isFinite(n)?n:NaN}
function calc(s){
  var i=0;s=s.replace(/\s+/g,'');
  function expr(){var v=term();while(s[i]==='+'||s[i]==='-'){var o=s[i++],t=term();v=o==='+'?v+t:v-t}return v}
  function term(){var v=fac();while(s[i]==='*'||s[i]==='/'){var o=s[i++],t=fac();v=o==='*'?v*t:v/t}return v}
  function fac(){
    if(s[i]==='-'){i++;return -fac()} if(s[i]==='+'){i++;return fac()}
    if(s[i]==='('){i++;var v=expr();if(s[i]!==')')throw 0;i++;return v}
    var m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
  }
  var v=expr();if(i!==s.length)throw 0;return v;
}
function cellVal(rows,r,c,stack){
  var raw=rows[r]&&rows[r][c];if(raw==null)return '';
  var s=String(raw);if(s.charAt(0)!=='=')return s;
  var k=r+','+c;if(stack[k])return '#CIRC';
  stack[k]=1;var out;
  try{out=evalF(rows,s.slice(1),stack)}catch(e){out='#ERR'}
  delete stack[k];return out;
}
function rangeVals(rows,a,b,stack){
  var m1=/^([A-Z]+)(\d+)$/i.exec(a),m2=/^([A-Z]+)(\d+)$/i.exec(b),out=[];
  var c1=colIdx(m1[1]),c2=colIdx(m2[1]),r1=+m1[2]-1,r2=+m2[2]-1;
  for(var r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)for(var c=Math.min(c1,c2);c<=Math.max(c1,c2);c++){
    var n=num(cellVal(rows,r,c,stack));if(isFinite(n))out.push(n);
  }
  return out;
}
function evalF(rows,expr,stack){
  var e=expr.replace(/(SUM|AVERAGE|AVG|MIN|MAX|COUNT)\(\s*([A-Z]+\d+)\s*:\s*([A-Z]+\d+)\s*\)/gi,function(_,fn,a,b){
    var v=rangeVals(rows,a,b,stack),x;fn=fn.toUpperCase();
    if(fn==='SUM')x=v.reduce(function(p,q){return p+q},0);
    else if(fn==='COUNT')x=v.length;
    else if(!v.length)x=0;
    else if(fn==='MIN')x=Math.min.apply(null,v);
    else if(fn==='MAX')x=Math.max.apply(null,v);
    else x=v.reduce(function(p,q){return p+q},0)/v.length;
    return '('+x+')';
  });
  e=e.replace(/\b([A-Z]{1,2})(\d{1,3})\b/gi,function(_,c,r){var n=num(cellVal(rows,+r-1,colIdx(c),stack));return '('+(isFinite(n)?n:0)+')'});

  if(!e.trim())return '';
  var res=calc(e);if(typeof res!=='number'||!isFinite(res))return '#ERR';

}
function fmtNum(n){return n.toLocaleString(undefined,{maximumFractionDigits:2})}
function disp(rows,r,c){var v=cellVal(rows,r,c,{});return typeof v==='number'?fmtNum(v):v}

/* ---------- reminders ---------- */
function nextAt(r){
  var d=new Date(r.at),a=r.at;
  do{
    if(r.repeat==='daily')d.setDate(d.getDate()+1);else if(r.repeat==='weekly')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1);
    a=d.getTime();
  }while(a<=Date.now());
  return a;
}
function beep(p){
  try{
    var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    actx=actx||new A();if(actx.state==='suspended')actx.resume();
    /* each priority has its own pattern so urgency can be heard, even with the app open */
    var lvl=Math.min(4,Math.max(0,p|0)),tones=[[784,0],[784,.24],[988,.48]];
    if(lvl<=0)tones=[[659,0]];
    else if(lvl===1)tones=[[659,0],[784,.22]];
    else if(lvl===2)tones=[[784,0],[988,.24],[784,.48]];
    else if(lvl===4)tones=[[988,0],[1175,.14],[988,.28],[1175,.42],[988,.56],[1175,.7]];
    var vol=lvl>=4?.4:.28;
    tones.forEach(function(t){
      var o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+t[1];

      g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.16);
      o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+.18);
    });
  }catch(e){}
}
function checkReminders(){
  var now=Date.now(),ch=false;
  S.items.forEach(function(it){
    var r=it.remind;if(!r||r.done||it.trashed)return;
    if(r.at<=now&&r.firedAt!==r.at){r.firedAt=r.at;ch=true;fire(it,now-r.at>90000)}
  });

}
function fire(it,missed){
  beep(it.priority);
  try{if(!NATIVE&&'Notification' in window&&Notification.permission==='granted')new Notification(it.title||'Reminder',{body:whenText(it.remind.at)})}catch(e){}

    if(logoOpen){closeLogo();return}
    if(VIEW_ID&&!E&&!MODAL){if(vMenuOpen){vMenuOpen=false;renderViewer()}else closeViewer();return}
  }
  if(e.key==='Escape'&&(E||MODAL)){closeModal();return}
  if(E&&f==='newli'&&e.key==='Enter'){e.preventDefault();var v=t.value.trim();if(v){var n={id:uid(),t:v,done:false};E.it.list.push(n);touch();renderEditor('#newli')}return}
  if(E&&f==='li'){
    var arr=E.it.list,idx=-1;arr.forEach(function(l,i){if(l.id===t.dataset.li)idx=i});
    if(e.key==='Enter'){e.preventDefault();var n2={id:uid(),t:'',done:false};arr.splice(idx+1,0,n2);touch();renderEditor('[data-li="'+n2.id+'"][data-f="li"]')}
    else if(e.key==='Backspace'&&t.value===''&&idx>=0){e.preventDefault();var prev=arr[idx-1];arr.splice(idx,1);touch();renderEditor(prev?'[data-li="'+prev.id+'"][data-f="li"]':'#newli')}
    return;
  }
  if(E&&f==='body'&&e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.isComposing){if(continueList(t))e.preventDefault();return}
  if(E&&f==='labin'&&(e.key==='Enter'||e.key===',')){
    e.preventDefault();var l=t.value.trim().replace(/,/g,'');if(l&&E.it.labels.indexOf(l)<0){E.it.labels.push(l);touch();renderEditor('#labin')}return;
  }
  if(e.target.matches&&e.target.matches('input,textarea,select'))return;
  if(E||MODAL)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus()}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();openEditor(newItem('note'),true)}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){checkReminders();tick()}});

/* ---------- logo menu ---------- */
var logoOpen=false;
function closeLogo(){logoOpen=false;var m=$('#logomenu');if(m)m.hidden=true;$$('.logo-btn').forEach(function(b){b.setAttribute('aria-expanded','false')})}
function openLogo(btn){
  var m=$('#logomenu'),r=btn.getBoundingClientRect();
  logoOpen=true;m.hidden=false;
  m.style.top=(r.bottom+8)+'px';
  m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-m.offsetWidth-8))+'px';
  $$('.logo-btn').forEach(function(b){b.setAttribute('aria-expanded','true')});
}

/* ---------- full-page viewer ---------- */
var VIEW_ID=null, vMenuOpen=false;
function openViewer(id){
  var it=byId(id);if(!it)return;
  VIEW_ID=id;vMenuOpen=false;
  $('#viewer').hidden=false;document.body.classList.add('noscroll');
  renderViewer(true);
}
function closeViewer(){
  VIEW_ID=null;vMenuOpen=false;
  var v=$('#viewer');v.hidden=true;v.innerHTML='';
  if(!E&&!MODAL)document.body.classList.remove('noscroll');
  render();
}
function renderViewer(fresh){
  var it=VIEW_ID&&byId(VIEW_ID);
  if(!it){closeViewer();return}
  var v=$('#viewer'),sc=v.querySelector('.vw-scroll'),top=(fresh||!sc)?0:sc.scrollTop;
  var kind=it.type==='list'?'Checklist':it.type==='table'?'Table':'Note',body;
  if(it.type==='note'){
    body=it.body.trim()?'<div class="vw-body">'+esc(it.body)+'</div>':'<div class="vw-body vw-empty">This note is empty.</div>';
  }else if(it.type==='list'){
    body=it.list.length
      ?'<div class="vw-list">'+it.list.map(function(x){return '<div class="vw-li'+(x.done?' done':'')+'"><button class="cb" data-act="vtick" data-li="'+x.id+'" aria-label="Toggle '+esc(x.t)+'">'+ic('check')+'</button><span>'+esc(x.t)+'</span></div>'}).join('')+'</div>'
      :'<div class="vw-body vw-empty">No items yet.</div>';
  }else{
    var rs=it.table.rows,cols=rs[0]?rs[0].length:0,tb='<div class="grid-wrap vw-table"><table class="st"><thead><tr><th></th>';
    for(var c=0;c<cols;c++)tb+='<th>'+colName(c)+'</th>';
    tb+='</tr></thead><tbody>';
    rs.forEach(function(r,ri){
      tb+='<tr'+(it.table.hdr&&ri===0?' class="h"':'')+'><th>'+(ri+1)+'</th>';
      for(var k=0;k<cols;k++){var d=disp(rs,ri,k);tb+='<td'+(d!==''&&isFinite(num(d))?' class="n"':'')+'>'+esc(d)+'</td>'}
      tb+='</tr>';
    });
    body=tb+'</tbody></table></div>';
  }
  var meta=priChip(it.priority)+remChip(it)+it.labels.map(function(l){return '<span class="chip lb">'+esc(l)+'</span>'}).join('');
  v.style.setProperty('--cbg','var(--c-'+it.color+')');
  v.innerHTML=
    '<div class="vw-top"><button class="vw-btn" data-act="vclose" aria-label="Back">'+ic('left')+'</button><span class="vw-kind">'+kind+(it.archived?' · archived':'')+'</span><button class="vw-btn" data-act="vmenu" aria-haspopup="menu" aria-expanded="'+vMenuOpen+'" aria-label="More options">'+ic('dots','dotsi')+'</button></div>'+
    '<div class="vw-scroll"><div class="vw-inner">'+
      '<h1 class="vw-title">'+(esc(it.title)||'<span class="vw-empty">Untitled</span>')+'</h1>'+
      (meta?'<div class="meta vw-meta">'+meta+'</div>':'')+body+
    '</div></div>'+
    '<div class="vw-menu" role="menu"'+(vMenuOpen?'':' hidden')+'>'+
      '<button role="menuitem" data-act="vedit">'+ic('edit','sm')+'Edit</button>'+
      '<button role="menuitem" data-act="vdup">'+ic('copy','sm')+'Duplicate</button>'+
      '<button role="menuitem" data-act="varch">'+ic(it.archived?'restore':'archive','sm')+(it.archived?'Unarchive':'Archive')+'</button>'+
      '<hr><button role="menuitem" class="dz" data-act="vtrash">'+ic('trash','sm')+'Delete</button>'+
    '</div>';
  var ns=v.querySelector('.vw-scroll');if(ns)ns.scrollTop=top;
}

/* ---------- native (Android app) ---------- */
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function LNP(){return NATIVE&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications}
function nid(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
/* one Android channel per priority: channels own their sound, so each level sounds different */
var CHANS=[['rongo_low','Reminders: low',3,'rongo_low.wav'],['rongo_med','Reminders: medium',4,'rongo_med.wav'],['rongo_high','Reminders: high',4,'rongo_high.wav'],['rongo_urgent','Reminders: urgent',5,'rongo_urgent.wav']];
function chanIdx(p){var l=Math.min(4,Math.max(0,p|0));return l<2?0:l-1}
var syncing=false,syncAgain=false;
async function syncNative(){
  var LN=LNP();if(!LN)return;
  if(syncing){syncAgain=true;return}
  syncing=true;
  try{
    var pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(function(n){return {id:n.id}})});
    var now=Date.now(),list=[];
    S.items.forEach(function(it){
      var r=it.remind;if(!r||r.done||it.trashed)return;
      var at=r.at;
      if(at<=now){if(r.repeat==='none')return;at=nextAt({at:r.at,repeat:r.repeat})}
      var sch={at:new Date(at),allowWhileIdle:true};
      if(r.repeat!=='none'){sch.repeats=true;sch.every=r.repeat==='daily'?'day':r.repeat==='weekly'?'week':'month'}
      var body=it.type==='note'?it.body:it.type==='list'?it.list.filter(function(x){return !x.done}).map(function(x){return x.t}).join(', '):'Table';
      list.push({id:nid(it.id),title:it.title||(it.type==='list'?'Checklist':it.type==='table'?'Table':'Reminder'),body:(body||PRI[it.priority]+' priority').slice(0,120),channelId:CHANS[chanIdx(it.priority)][0],sound:CHANS[chanIdx(it.priority)][3],smallIcon:'ic_stat_rongo',largeIcon:'rongo_logo',iconColor:'#6B4EFF',schedule:sch});
    });
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
  syncing=false;if(syncAgain){syncAgain=false;syncNative()}
}
async function setupNative(){
  var LN=LNP();if(!LN)return;
  try{
    for(var ci=0;ci<CHANS.length;ci++){var c=CHANS[ci];try{await LN.createChannel({id:c[0],name:c[1],description:'Reminders from your notes',importance:c[2],visibility:1,vibration:true,sound:c[3]})}catch(e){}}
    var p=await LN.checkPermissions();if(p.display!=='granted')await LN.requestPermissions();
    try{var ex=await LN.checkExactNotificationSetting();if(ex.exact_alarm==='denied')toast('For on-time alerts open Settings and tap Allow system alerts')}catch(e){}
    syncNative();
  }catch(e){}
}
async function saveFile(name,text){
  try{var d=window.claude&&window.claude.use&&await window.claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}
  catch(e){if(e&&e.code==='declined')return;throw e}
  if(NATIVE){
    var P=window.Capacitor.Plugins,r=await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
    await P.Share.share({title:name,url:r.uri,dialogTitle:'Save or share'});return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- boot ---------- */
function onViewport(){var t=$('#e-body');if(E&&t&&document.activeElement===t)keepCaret(t)}
window.addEventListener('resize',onViewport);
if(window.visualViewport)window.visualViewport.addEventListener('resize',onViewport);
S=loadLocal();
if(!S){S=normalize({items:seed(),settings:{},updated:Date.now()});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
applyTheme();render();setSync('local');
checkReminders();
setInterval(function(){tick();},1000);
setInterval(checkReminders,5000);
initDb();
if(NATIVE)setupNative();
})();
